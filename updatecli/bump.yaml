# yamllint disable-file

# One pipeline per tool and repository, so each repository gets one pull
# request per tool, bumping the pin in every workflow that has one.
# Rendered with the values discover.py prints.
{{ range .targets }}
{{- $name := .tool }}
{{- $tool := index $.tools .tool }}
---
name: 'ci: bump {{ .tool }}'
pipelineid: '{{ .tool }}'

scms:
  default:
    kind: github
    spec:
      owner: '{{ $.owner }}'
      repository: '{{ .repo }}'
      branch: '{{ .branch }}'
      user: femiwiki-pat-owner[bot]
      email: 204444552+femiwiki-pat-owner[bot]@users.noreply.github.com
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'

actions:
  default:
    kind: github/pullrequest
    scmid: default
    spec:
      title: 'ci: bump {{ .tool }} to {{ source "release" }}'
      # updatecli adds the notes of the release it bumps to; this points at
      # the ones it skips.
      description: 'Earlier releases: https://github.com/{{ $tool.repository }}/releases'
      labels:
        - dependencies

sources:
  release:
    name: 'Latest {{ .tool }} release'
    kind: githubrelease
    spec:
      owner: '{{ index (splitList "/" $tool.repository) 0 }}'
      repository: '{{ index (splitList "/" $tool.repository) 1 }}'
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      versionfilter:
        kind: regex/semver
        pattern: '*'
        regex: '^{{ regexQuoteMeta $tool.prefix }}(\d+\.\d+\.\d+)$'
    transformers:
      - trimprefix: '{{ $tool.prefix }}'

targets:
{{- range $i, $path := .paths }}
  workflow{{ $i }}:
    name: 'ci: bump {{ $name }} to {{ source "release" }}'
    kind: file
    scmid: default
    sourceid: release
    spec:
      file: '{{ $path }}'
      matchpattern: '{{ $tool.pattern }}'
      replacepattern: '${1}{{ source "release" }}'
{{- end }}
{{ end }}

# One pipeline per repository that calls this repository's workflows, moving
# every pin to head, which updatecli.yml passes.
{{- if $.head }}
{{ range .pins }}
---
name: 'ci: bump {{ $.owner }}/.github workflows'
pipelineid: 'shared-workflows'

scms:
  default:
    kind: github
    spec:
      owner: '{{ $.owner }}'
      repository: '{{ .repo }}'
      branch: '{{ .branch }}'
      user: femiwiki-pat-owner[bot]
      email: 204444552+femiwiki-pat-owner[bot]@users.noreply.github.com
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'

actions:
  default:
    kind: github/pullrequest
    scmid: default
    spec:
      title: 'ci: bump {{ $.owner }}/.github workflows to {{ substr 0 7 $.head }}'
      description: |
        Changes:
        {{- range .shas }}
        - https://github.com/{{ $.owner }}/.github/compare/{{ . }}...{{ $.head }}
        {{- end }}
      labels:
        - dependencies

targets:
{{- range $i, $path := .paths }}
  workflow{{ $i }}:
    name: 'ci: bump {{ $.owner }}/.github workflows to {{ substr 0 7 $.head }}'
    kind: file
    scmid: default
    disablesourceinput: true
    spec:
      file: '{{ $path }}'
      matchpattern: '{{ $.shared.pattern }}'
      replacepattern: '${1}{{ $.head }}'
{{- end }}
{{ end }}
{{- end }}
