name: Required
on:
  pull_request:
permissions: {}
jobs:
  lint:
    uses: ./.github/workflows/lint.yaml

  test:
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  forgotten:
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  # Outside the required gate: only comments on the pull request
  comment:
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  required:
    needs: [lint, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  deploy:
    needs: required
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
