---
name: Required
on:
  push:
    branches: [main]
  pull_request:
# A new commit on a pull request makes the run on its old commit pointless,
# so that run is cancelled. Each run on main gets a group of its own and is
# never cancelled. Branch protection reads only the newest commit's checks.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ case(github.event_name == 'pull_request',
    github.event.pull_request.number, github.run_id) }}
  cancel-in-progress: true
permissions: {}
jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  shared-lint:
    uses: ./.github/workflows/shared-lint.yml
    permissions:
      contents: read

  long-comments:
    uses: ./.github/workflows/long-comments.yml
    permissions:
      contents: read

  long-comments-test:
    uses: ./.github/workflows/long-comments-test.yml
    permissions:
      contents: read

  required-gate:
    uses: ./.github/workflows/required-gate.yml
    permissions:
      contents: read

  required-gate-test:
    uses: ./.github/workflows/required-gate-test.yml
    permissions:
      contents: read

  # The one check branch protection requires. What has to pass is the
  # workflows called above, so adding a check does not touch femiwiki/infra.
  required:
    needs: [lint, shared-lint, long-comments, long-comments-test, required-gate, required-gate-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every workflow above passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
