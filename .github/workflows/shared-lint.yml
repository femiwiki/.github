name: Shared lint

on:
  workflow_call:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          path: repo

      # zizmor reads its config only from inside the workspace, so it sits next to the checkout
      - name: Write the config
        run: |
          cat > zizmor.yml <<'CONFIG'
          rules:
            unpinned-uses:
              config:
                policies:
                  '*': hash-pin
            # actionlint rejects the `$/` syntax this asks for: https://github.com/rhysd/actionlint/issues/711
            self-repository:
              disable: true
          CONFIG

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: repo
          config: zizmor.yml
          advanced-security: false

  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.6.6

      # rumdl and yamllint own these, which Biome checks by default from 2.6
      - name: Skip Markdown and YAML
        run: printf '%s\n' '*.md' '*.yml' '*.yaml' >> .git/info/exclude

      # Biome's defaults, so a repository needs a .biome.json only for files of its own to skip
      - run: >-
          biome ci --error-on-warnings
          --vcs-enabled=true --vcs-client-kind=git --vcs-use-ignore-file=true
          --files-ignore-unknown=true --no-errors-on-unmatched

  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Biome cannot read LESS, so Prettier checks it with the tabs Biome uses
      - run: >-
          git ls-files -z '*.less' |
          xargs -0 -r npx --yes prettier@3.9.9 --check --use-tabs

  rumdl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # release-please writes these; --exclude would drop the repository's own excludes instead of adding to them
      - name: Skip CHANGELOG.md
        run: echo CHANGELOG.md >> .git/info/exclude

      - uses: rvben/rumdl@bb84a49a85625b31ecf6c3e58b7bca7c75fbfefb # v0.2.77
        with:
          version: 0.3.2
          # Long commands and keys in code blocks cannot wrap
          args: --config MD013.code-blocks=false

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Used when the repository has no yamllint config of its own
      - name: Write the default config
        run: |
          cat > "$RUNNER_TEMP/yamllint.yaml" <<'CONFIG'
          extends: default
          rules:
            comments:
              min-spaces-from-content: 1
            document-start: disable
            line-length: disable
            truthy:
              check-keys: false
          CONFIG

      - run: |
          config=()
          if [ ! -e .yamllint ] && [ ! -e .yamllint.yaml ] && [ ! -e .yamllint.yml ]; then
            config=(-c "$RUNNER_TEMP/yamllint.yaml")
          fi
          git ls-files -z '*.yml' '*.yaml' |
            xargs -0 -r pipx run --spec yamllint==1.38.0 yamllint --strict "${config[@]}"

  php:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - if: hashFiles('**/*.php') != ''
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      # Only metrics: style is left to each repository's own MediaWiki ruleset.
      # Each limit is today's largest function across the organization.
      - if: hashFiles('**/*.php') != ''
        name: Write the ruleset
        run: |
          mkdir "$RUNNER_TEMP/phpcs"
          cat > "$RUNNER_TEMP/phpcs/composer.json" <<'COMPOSER'
          {
            "require": {
              "squizlabs/php_codesniffer": "4.0.4",
              "slevomat/coding-standard": "8.31.3"
            },
            "config": {
              "allow-plugins": {
                "dealerdirect/phpcodesniffer-composer-installer": true
              }
            }
          }
          COMPOSER
          cat > "$RUNNER_TEMP/phpcs/ruleset.xml" <<'RULESET'
          <?xml version="1.0"?>
          <ruleset name="femiwiki-metrics">
            <arg name="extensions" value="php"/>
            <!-- FediFeeds InboxHandler::execute() -->
            <rule ref="Generic.Metrics.CyclomaticComplexity">
              <properties>
                <property name="complexity" value="31"/>
                <property name="absoluteComplexity" value="31"/>
              </properties>
            </rule>
            <!-- FemiwikiSkin Portlet::onSidebarBeforeOutput(), FediFeeds Notes::getSectionItems() -->
            <rule ref="Generic.Metrics.NestingLevel">
              <properties>
                <property name="nestingLevel" value="4"/>
                <property name="absoluteNestingLevel" value="4"/>
              </properties>
            </rule>
            <!-- FediFeeds InboxHandler::execute() -->
            <rule ref="SlevomatCodingStandard.Functions.FunctionLength">
              <properties>
                <property name="maxLinesLength" value="66"/>
              </properties>
            </rule>
            <!-- FediFeeds Notes::getSectionItems(); this sniff fails at the threshold itself -->
            <rule ref="SlevomatCodingStandard.Complexity.Cognitive">
              <properties>
                <property name="warningThreshold" value="38"/>
                <property name="errorThreshold" value="38"/>
              </properties>
            </rule>
          </ruleset>
          RULESET

      - if: hashFiles('**/*.php') != ''
        run: composer install --working-dir="$RUNNER_TEMP/phpcs" --no-interaction --no-progress

      - if: hashFiles('**/*.php') != ''
        run: >-
          git ls-files -z '*.php' |
          xargs -0 -r "$RUNNER_TEMP/phpcs/vendor/bin/phpcs" --standard="$RUNNER_TEMP/phpcs/ruleset.xml"

  extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: GitHub Actions files end in .yml, other YAML files in .yaml
        run: |
          wrong=$(
            git ls-files '.github/*.yaml' 'action.yaml' '*/action.yaml'
            git ls-files '*.yml' ':!.github/*' ':!action.yml' ':!*/action.yml' ':!FUNDING.yml'
          )
          if [ -n "$wrong" ]; then echo "$wrong"; exit 1; fi
