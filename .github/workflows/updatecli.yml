---
name: Updatecli

# Bumps what workflows across the organization pin that Dependabot cannot: tool
# versions in action inputs, and commits of this repository's workflows.

on:
  # A fix to a reusable workflow reaches the repositories that call it as soon
  # as it lands.
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      repos: ${{ steps.repos.outputs.list }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Finding out which workflows pin which tool reads every workflow in the
      # organization, so the answer is kept a week, or until discover.py changes.
      - id: week
        run: echo "number=$(( $(date +%s) / 604800 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: targets
        with:
          path: values.json
          key: updatecli-targets-${{ steps.week.outputs.number }}-${{ hashFiles('updatecli/discover.py') }}

      # Reading every repository is the point of this token, so it covers the
      # whole installation, read-only.
      - if: steps.targets.outputs.cache-hit != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: read
        with:
          client-id: ${{ vars.PAT_APPLICATION_CLIENT_ID }}
          private-key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          permission-contents: read

      - if: steps.targets.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
        run: updatecli/discover.py > values.json

      - id: repos
        run: echo "list=$(jq -c '[.targets[].repo, .pins[].repo] | unique' values.json)" >> "$GITHUB_OUTPUT"

      # The last commit of main that changed a workflow, so other commits open no
      # pull requests; a branch run by hand moves no pins.
      - if: github.ref == 'refs/heads/main'
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$GITHUB_SHA&path=.github/workflows&per_page=1" --jq '.[0].sha')" >> "$GITHUB_OUTPUT"

      - env:
          HEAD: ${{ steps.head.outputs.sha }}
        run: |
          jq -n --arg head "$HEAD" '{head: $head}' > head.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updatecli-values
          path: |
            values.json
            head.json
          retention-days: 1

  # One repository at a time, each held until the checks of its pull requests
  # finish, so their workflows do not all queue for runners at once.
  apply:
    needs: [discover]
    if: needs.discover.outputs.repos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        repo: ${{ fromJSON(needs.discover.outputs.repos) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: updatecli-values

      # GITHUB_TOKEN would open pull requests that start no workflows; this
      # token reaches only the repository of this leg.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: write
        with:
          client-id: ${{ vars.PAT_APPLICATION_CLIENT_ID }}
          private-key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: updatecli/updatecli-action@ca8c01bf875e2520512c344a71dd02f3dc3326a7 # v3.7.0
        with:
          version: v0.121.0

      - id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - env:
          REPO: ${{ matrix.repo }}
          UPDATECLI_GITHUB_TOKEN: ${{ steps.write.outputs.token }}
        run: |
          jq --arg repo "$REPO" '.targets |= map(select(.repo == $repo)) | .pins |= map(select(.repo == $repo))' values.json > repo.json
          updatecli pipeline apply --config updatecli/bump.yaml --values repo.json --values head.json

      # A failing check ends the wait like a passing one; the next repository
      # goes ahead either way. A repository GITHUB_TOKEN cannot read is not waited for.
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ matrix.repo }}
          STARTED: ${{ steps.started.outputs.at }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for n in $(gh pr list --repo "$OWNER/$REPO" --state open --label dependencies --json number,createdAt,updatedAt \
              --jq ".[] | select(.updatedAt >= \"$STARTED\") | .number"); do
            gh pr checks "$n" --repo "$OWNER/$REPO" --watch --interval 30 || true
          done
