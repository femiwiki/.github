name: Required gate

# Fails when a job that runs on pull requests can fail without failing the
# job branch protection requires, such as a new workflow nobody calls from it.

on:
  workflow_call:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Write the script
        run: |
          cat > "$RUNNER_TEMP/required-gate.mts" <<'SCRIPT'
          import { execFileSync } from 'node:child_process';
          import { readdirSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { fileURLToPath } from 'node:url';

          type Job = { needs?: string | string[] };
          type Workflow = { on?: string | string[] | Record<string, unknown>; jobs?: Record<string, Job> };
          type Problem = { file: string; line: number; message: string };
          type Core = {
          	error: ( message: string, properties: { file: string; startLine: number } ) => void;
          	setFailed: ( message: string ) => void;
          };

          // The job ids branch protection requires: `required` in most repositories, `gate` in femiwiki/infra
          const GATES = [ 'required', 'gate' ];
          const MARKER = /^\s*# Outside the required gate: \S/;

          const triggers = ( on: Workflow[ 'on' ] ): string[] =>
          	typeof on === 'string' ? [ on ] : Array.isArray( on ) ? on : Object.keys( on ?? {} );

          const needsOf = ( job: Job | undefined ): string[] =>
          	job?.needs === undefined ? [] : typeof job.needs === 'string' ? [ job.needs ] : job.needs;

          // A key is marked when one of the comment lines right above it carries the marker
          function marked( lines: string[], key: RegExp, from = 0 ): { line: number; marked: boolean } {
          	const index = lines.findIndex( ( text, i ) => i >= from && key.test( text ) );
          	let above = index - 1;
          	while ( above >= 0 && /^\s*#/.test( lines[ above ] ) ) {
          		if ( MARKER.test( lines[ above ] ) ) {
          			return { line: index + 1, marked: true };
          		}
          		above--;
          	}
          	return { line: index + 1, marked: false };
          }

          function closure( start: string[], next: ( id: string ) => string[] ): Set<string> {
          	const seen = new Set<string>();
          	const queue = [ ...start ];
          	while ( queue.length > 0 ) {
          		for ( const id of next( queue.pop() as string ) ) {
          			if ( !seen.has( id ) ) {
          				seen.add( id );
          				queue.push( id );
          			}
          		}
          	}
          	return seen;
          }

          export function check( root: string ): Problem[] {
          	const problems: Problem[] = [];
          	const files = readdirSync( join( root, '.github/workflows' ) ).filter( ( name ) => /\.ya?ml$/.test( name ) ).sort();
          	for ( const name of files ) {
          		const file = `.github/workflows/${ name }`;
          		const lines = readFileSync( join( root, file ), 'utf8' ).split( '\n' );
          		const workflow: Workflow = JSON.parse( execFileSync( 'yq', [ '-o=json', '.', join( root, file ) ], { encoding: 'utf8' } ) );
          		if ( !triggers( workflow.on ).includes( 'pull_request' ) ) {
          			continue;
          		}
          		const on = marked( lines, /^["']?on["']?:/ );
          		if ( on.marked ) {
          			continue;
          		}
          		const jobs = workflow.jobs ?? {};
          		const ids = Object.keys( jobs );
          		const gates = ids.filter( ( id ) => GATES.includes( id ) );
          		if ( gates.length === 0 ) {
          			problems.push( { file, line: on.line, message: `${ file } runs on pull requests, but no ${ GATES.join( ' or ' ) } job waits for it. Call it from the gate, or mark \`on:\` with a "# Outside the required gate: <why>" comment.` } );
          			continue;
          		}
          		const upstream = closure( gates, ( id ) => needsOf( jobs[ id ] ) );
          		const downstream = closure( gates, ( id ) => ids.filter( ( other ) => needsOf( jobs[ other ] ).includes( id ) ) );
          		const jobsLine = lines.findIndex( ( text ) => /^jobs:/.test( text ) );
          		const indent = lines.slice( jobsLine + 1 ).find( ( text ) => /^\s+[^\s#]/.test( text ) )?.match( /^\s+/ )?.[ 0 ] ?? '  ';
          		for ( const id of ids ) {
          			if ( gates.includes( id ) || upstream.has( id ) || downstream.has( id ) ) {
          				continue;
          			}
          			const job = marked( lines, new RegExp( `^${ indent }["']?${ id }["']?:` ), jobsLine );
          			if ( !job.marked ) {
          				problems.push( { file, line: job.line, message: `Job ${ id } runs on pull requests, but ${ gates.join( ' and ' ) } neither needs it nor is needed by it. Add it to the gate's needs, or mark it with a "# Outside the required gate: <why>" comment.` } );
          			}
          		}
          	}
          	return problems;
          }

          export default function ( { core }: { core: Core } ): void {
          	const problems = check( process.env.GITHUB_WORKSPACE ?? '.' );
          	for ( const { file, line, message } of problems ) {
          		core.error( message, { file, startLine: line } );
          	}
          	if ( problems.length > 0 ) {
          		core.setFailed( `${ problems.length } pull request check(s) can fail without failing the required gate` );
          	}
          }

          if ( process.argv[ 1 ] === fileURLToPath( import.meta.url ) ) {
          	for ( const { file, line } of check( process.argv[ 2 ] ?? '.' ) ) {
          		console.log( `${ file }:${ line }` );
          	}
          }
          SCRIPT

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: check } = await import(`${process.env.RUNNER_TEMP}/required-gate.mts`)
            check({ core })
