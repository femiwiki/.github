name: Long comments test

on:
  workflow_call:

permissions: {}

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Opengrep
        env:
          VERSION: v1.30.0
          SHA256: 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/$VERSION/opengrep_manylinux_x86"
          echo "$SHA256  $RUNNER_TEMP/opengrep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opengrep"

      # The rule the shared workflow writes, run on fixtures copied out of tests/, which Opengrep skips
      - run: |
          yq -r '.jobs.opengrep.steps[] | select(.name == "Write the rule") | .run' \
            .github/workflows/long-comments.yml | bash
          cp -r tests/long-comments "$RUNNER_TEMP/fixtures"
          "$RUNNER_TEMP/opengrep" scan --config "$RUNNER_TEMP/long-comments.yaml" \
            --json --quiet "$RUNNER_TEMP/fixtures" |
            jq -r '.results[].path | ltrimstr(env.RUNNER_TEMP + "/fixtures/")' | sort -u |
            diff - tests/long-comments/expected.txt
